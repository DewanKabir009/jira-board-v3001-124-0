# v3001.124.0 workflow bootstrap
name: Deploy Cloudflare Board and HQ

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - dashboard-data.json
      - index.html
      - boards.json
      - modern/**
      - workers/**
      - scripts/prepare-cloudflare-hq-assets.cjs
      - wrangler.hq.toml
      - .github/workflows/deploy-cloudflare-hq.yml

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy static board and HQ assets
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
      SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
      ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify Cloudflare token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN in repository secrets before running this workflow."
            exit 1
          fi

      - name: Prepare Cloudflare board and HQ assets
        run: node scripts/prepare-cloudflare-hq-assets.cjs

      - name: Sync HQ Worker secrets
        run: |
          set -euo pipefail
          for secret_name in SLACK_BOT_TOKEN SLACK_CHANNEL_ID SLACK_SIGNING_SECRET ASANA_ACCESS_TOKEN JIRA_EMAIL JIRA_API_TOKEN; do
            secret_value="${!secret_name:-}"
            if [ -n "$secret_value" ]; then
              printf '%s' "$secret_value" | npx -y wrangler versions secret put "$secret_name" -c wrangler.hq.toml
            else
              echo "::notice::$secret_name is not set; related Legacy HQ integration will report setup needed."
            fi
          done

      - name: Deploy board and HQ Worker Static Assets
        run: npx -y wrangler deploy -c wrangler.hq.toml
